# nginx for AI Avatar 3D — HTTPS in front of the app so the browser allows the microphone.
# Runs in its own container; with a real domain, put your certificate in certs/ (server.crt, server.key).
worker_processes 1;
events { worker_connections 256; }

http {
  include       /etc/nginx/mime.types;
  types { model/gltf-binary glb; }
  sendfile on;
  server_tokens off;
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  upstream avatar_app { server web:3300; }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;          # gesture clip upload is up to 20 MB, STT audio up to 8 MB

    location / {
      proxy_pass http://avatar_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 120s;         # a Voice Command is answered within seconds (workers never queue)
      proxy_send_timeout 120s;
    }
  }
}
