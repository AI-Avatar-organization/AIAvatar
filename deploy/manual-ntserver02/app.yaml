apiVersion: v1
kind: Namespace
metadata:
  name: aiavatar
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiavatar-data
  namespace: aiavatar
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiavatar-web
  namespace: aiavatar
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aiavatar-web
  template:
    metadata:
      labels:
        app: aiavatar-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: seed-data
          image: docker.io/library/aiavatar:20261113-5
          imagePullPolicy: Never
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - /bin/sh
            - -ec
            - |
              if [ ! -f /state/.seeded ]; then
                mkdir -p /state/maps /state/gestures
                cp -an /app/maps/. /state/maps/
                cp -an /app/gestures/. /state/gestures/
                chown -R 1000:1000 /state/maps /state/gestures
                touch /state/.seeded
              fi
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /state
      containers:
        - name: web
          image: docker.io/library/aiavatar:20261113-5
          imagePullPolicy: Never
          env:
            - name: AUTHOR_ENABLED
              value: "false"
            - name: STT_SERVICE_TH
              value: http://aiavatar-stt-th:3401
            - name: STT_SERVICE_EN
              value: http://aiavatar-stt-en:3402
            - name: SLOT_TTL_MS
              value: "30000"
          ports:
            - name: http
              containerPort: 3300
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/maps
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/maps
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/maps
              subPath: maps
            - name: data
              mountPath: /app/gestures
              subPath: gestures
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aiavatar-data
---
apiVersion: v1
kind: Service
metadata:
  name: aiavatar-web
  namespace: aiavatar
spec:
  selector:
    app: aiavatar-web
  ports:
    - name: http
      port: 3300
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiavatar-stt-th
  namespace: aiavatar
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aiavatar-stt-th
  template:
    metadata:
      labels:
        app: aiavatar-stt-th
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: stt
          image: docker.io/library/aiavatar:20261113-5
          imagePullPolicy: Never
          command: ["node", "server/stt-service.mjs"]
          env:
            - name: STT_LANG
              value: th
            - name: STT_PORT
              value: "3401"
            - name: STT_WORKERS
              value: "3"
            - name: OMP_NUM_THREADS
              value: "2"
            - name: MKL_NUM_THREADS
              value: "2"
          ports:
            - name: http
              containerPort: 3401
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "6"
              memory: 8Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 120
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aiavatar-stt-th
  namespace: aiavatar
spec:
  selector:
    app: aiavatar-stt-th
  ports:
    - name: http
      port: 3401
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiavatar-stt-en
  namespace: aiavatar
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aiavatar-stt-en
  template:
    metadata:
      labels:
        app: aiavatar-stt-en
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: stt
          image: docker.io/library/aiavatar:20261113-5
          imagePullPolicy: Never
          command: ["node", "server/stt-service.mjs"]
          env:
            - name: STT_LANG
              value: en
            - name: STT_PORT
              value: "3402"
            - name: STT_WORKERS
              value: "2"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
          ports:
            - name: http
              containerPort: 3402
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 120
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aiavatar-stt-en
  namespace: aiavatar
spec:
  selector:
    app: aiavatar-stt-en
  ports:
    - name: http
      port: 3402
      targetPort: http
